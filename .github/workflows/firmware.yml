# SPDX-License-Identifier: GPL-3.0-only
# XENOISE: build the installable package (.fwsc) with JieLi's toolchain on every push of the xanoise branch, attach it
# to the run, and publish it as the pre-release "xenoise-latest" to download and install from; then the site (GitHub
# Pages): the Pilot's Dock, the package and the emulator.
name: firmware
on:
  push:
    branches: [xanoise]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow fonttools
      - name: JieLi toolchain and SDK files (cached)
        uses: actions/cache@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK/cpu/wl82/tools
          key: jieli-ac79-v1.2.1
      - name: JieLi toolchain and SDK files
        run: |
          # gitee and JieLi's server reset connections now and then: retries with backoff; the cache keeps them
          retry() { for d in 0 5 15 30 60; do sleep $d; "$@" && return 0; done; return 1; }
          T=$HOME/fw-AC79_AIoT_SDK/cpu/wl82/tools
          [ -e "$HOME/.jieli/toolchain" ] || retry sh tools/get_toolchain.sh "$HOME/.jieli"
          if [ ! -s "$T/uboot.boot" ] || [ ! -s "$T/cfg_tool.bin" ] || [ ! -s "$T/cfg/eq_cfg_hw.bin" ]; then
            rm -rf "$HOME/fw-AC79_AIoT_SDK"
            # the tested release, AC79NN_SDK_V1.2.1 (tools/build.py checks the three files)
            retry git clone --filter=blob:none --no-checkout https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"
            cd "$HOME/fw-AC79_AIoT_SDK" && git sparse-checkout set --no-cone /cpu/wl82/tools/uboot.boot /cpu/wl82/tools/cfg_tool.bin \
              /cpu/wl82/tools/cfg/eq_cfg_hw.bin && retry git checkout d179b4484759423312073f5fbb232501aa491047
          fi
      - name: firmware package
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee build.log
      - name: every function the firmware calls exists on the FM-1 (tools/check_extern.sh)
        run: sh tools/check_extern.sh
      - name: size map (the flash budget, by function)
        run: |
          python3 tools/size_map.py "$HOME/.jieli/toolchain/common/bin/objdump" build/felucca.elf | tee size_map.txt
      - uses: actions/upload-artifact@v4
        with:
          name: xenoise
          path: build/felucca.fwsc
          if-no-files-found: error
      - name: publish the package (pre-release xenoise-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/felucca.fwsc xenoise.fwsc
          gh release view xenoise-latest >/dev/null 2>&1 || gh release create xenoise-latest --prerelease --target "$GITHUB_SHA" \
            --title "XENOISE (latest build of the xanoise branch)" \
            --notes "JIANT FM with the Wonderblue tracker interface. Untested builds: install with the Pilot's Dock (https://xanacognition.github.io/XANOISE/) or tools/fm1_install.py."
          gh release upload xenoise-latest xenoise.fwsc size_map.txt tools/fm1_install.py --clobber
      - name: host tests (JIANT's suite and the tracker's, tests/run_tests.sh)
        run: |
          pip install numpy
          set -o pipefail
          sh tests/run_tests.sh 2>&1 | tee tests.log
      # (XENOISE) the site on GitHub Pages: the Pilot's Dock (install, tutorial, cheat sheet), the package, the emulator.
      # After the host tests: with emcc on the path they would run JIANT's own emulator test (web/emu/emu_test.mjs), which
      # checks JIANT's interface, not XENOISE's
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.11
      - name: the emulator and the site (web/xenoise/make_site.py)
        run: |
          sh web/emu/build.sh
          python3 web/xenoise/make_site.py build/felucca.fwsc build/site "$(git rev-parse --short HEAD)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
  # (XENOISE) the site: needs Settings > Pages > Source "GitHub Actions" once; until then this job fails alone. No
  # "environment: github-pages": its branch rule lets only the default branch deploy, and XENOISE builds on xanoise
  pages:
    needs: build
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
